[project]
name = "factor-research-pipeline"
version = "0.1.0"
description = "A factor research pipeline in which every step carries evidence against overfitting."
readme = "README.md"
authors = [{ name = "Yang Yuming" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2.1",
    "robust-mvo",
    "scikit-learn>=1.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "factorpipe"

[tool.uv.sources]
robust-mvo = { git = "https://github.com/Yuming-Yang/robust-mvo", rev = "4c05caf7a9528ded1a5e342eb5a0d333504479e8" }
btbias = { git = "https://github.com/Yuming-Yang/backtest-bias-suite", rev = "d5357e3c0bdad7444dc545452446065e07195680" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "alphalens-reloaded>=0.5.1",
    "btbias",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "statsmodels>=0.15.0",
]
